# One-off restore Job: same image as CronJob, MODE=restore.
# Archive on S3 must be mongodb_backup.archive.gz (mongodump --archive --gzip from backup.sh).
apiVersion: v1
kind: Secret
metadata:
  namespace: <your-namespace>
  name: mongodb-restore-secret
type: Opaque
stringData:
  MONGODB_URI: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_ENDPOINT: ""
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  S3_PATH: "backups/mongodb"
  # Optional: pin folder YYYYMMDD_HHMMSS; omit for latest under S3_PATH
  # RESTORE_TIMESTAMP: "20260305_020000"
  # RESTORE_DROP: "true"
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: <your-namespace>
  name: mongodb-restore
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongodb-restore
          image: ghcr.io/quyendv/mongodb-backup:latest
          imagePullPolicy: Always
          env:
            - name: MODE
              value: "restore"
          envFrom:
            - secretRef:
                name: mongodb-restore-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
